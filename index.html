<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilham's portfolio website</title>
    <meta name="description" content="Contains all about Ilham Rasyid Machfudi's all works">

    <!-- 1. Muat Google Font Open Sans agar seragam dengan article.html & home.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- 2. Berkas CSS Landing Page -->
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- 3. Berkas JavaScript Landing Page -->
    <script src="index.js" defer></script>

    <!-- 4. Modul Database Firebase -->
    <script type="module" src="firebase-init.js"></script>
</head>
<body>
    
    <!-- Header / Navbar di atas sejajar: link di kiri, pengalih bahasa di kanan -->
    <header class="navbar">
        <nav class="nav-links">
            <a href="home.html" data-lang-key="nav_home">Beranda</a>
            <a href="aboutme.html" data-lang-key="nav_about">Tentang Saya</a>
            <a href="category.html" data-lang-key="nav_category">Kategori</a>
        </nav>

        <!-- Tombol Pengalih Bahasa (Sejajar di kanan atas) -->
        <div class="lang-pill id-active" id="langToggle">
            <div class="lang-slider"></div>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
            <button type="button" class="lang-btn active" data-lang="id">ID</button>
        </div>
    </header>

    <!-- Hero Section: Terbagi 3 grup, terpusat di tengah layar -->
    <section class="hero">
        <!-- Grup 1: Display Text Sambutan & Keterangan (gap 4px) -->
        <div class="display-text">
            <p class="sambutan" id="sambutan" data-lang-key="hero_welcome">Welcome to my Website</p>
            <p class="keterangan" id="keterangan" data-lang-key="hero_desc">Melalui website ini kalian akan saya suguhkan hal-hal yang menarik bagi saya di dunia</p>
        </div>

        <!-- Grup 2: CTA Start & Tulisan Admin (gap 80px ke atas dan ke bawah) -->
        <div class="cta-wrapper">
            <button type="button" class="start" id="startBtn">START</button>
            <a href="home.html" class="admin-link" id="adminBtn">admin</a>
        </div>

        <!-- Grup 3: Teks Tambahan (gap 4px antar paragraf) -->
        <div class="tambahan">
            <p class="tambahan-p" data-lang-key="hero_credit_1">fully designed by Ilham for his interests</p>
            <p class="tambahan-p" data-lang-key="hero_credit_2">with the help of AI and internet for the codes and deployment</p>
        </div>
    </section>

</body>
</html>
