<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori - Ilham's Portfolio</title>
    <meta name="description"
        content="Jelajahi portofolio dan artikel berdasarkan kategori: Bisnis, Nutrisi, Studi, Ekonomi, Fisika, dan Buku.">

    <!-- 1. Google Fonts: Open Sans & Playfair Display untuk Judul Editorial -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet">

    <!-- 2. Stylesheet Khusus Halaman Kategori -->
    <link rel="stylesheet" href="category.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- 3. Script Logika Kategori (Filter, I18n, & Firestore) -->
    <script type="module" src="category.js" defer></script>
</head>

<body>

    <!-- ================= NAVBAR (PERSIS SESUAI PROYEK) ================= -->
    <header class="navbar">
        <form class="search-pill" id="searchForm">
            <button type="submit" class="search-btn" aria-label="Cari">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <input type="text" id="searchInput" name="q" placeholder="Cari..."
                data-lang-placeholder="search_placeholder" autocomplete="off">
        </form>

        <nav class="nav-links">
            <a href="index.html" data-lang-key="nav_home">Beranda</a>
            <a href="aboutme.html" data-lang-key="nav_about">Tentang Saya</a>
            <a href="category.html" class="active" data-lang-key="nav_category">Kategori</a>
        </nav>

        <!-- Tombol Pengalih Bahasa -->
        <div class="lang-pill id-active" id="langToggle">
            <div class="lang-slider"></div>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
            <button type="button" class="lang-btn active" data-lang="id">ID</button>
        </div>
    </header>

    <!-- ================= KONTEN UTAMA ================= -->
    <main class="category-container">

        <!-- HEADER KATEGORI: JUDUL BESAR & FILTER PILLS -->
        <section class="category-header">
            <h1 class="category-title" data-lang-key="categories_title">Categories</h1>

            <!-- Filter Pills -->
            <nav class="filter-pills" id="filterPills" aria-label="Filter Kategori">
                <button type="button" class="pill-btn active" data-category="all" data-lang-key="cat_all">All</button>
                <button type="button" class="pill-btn" data-category="business"
                    data-lang-key="cat_business">Business</button>
                <button type="button" class="pill-btn" data-category="nutrition"
                    data-lang-key="cat_nutrition">Nutrition</button>
                <button type="button" class="pill-btn" data-category="study" data-lang-key="cat_study">Study</button>
                <button type="button" class="pill-btn" data-category="economy"
                    data-lang-key="cat_economy">Economy</button>
                <button type="button" class="pill-btn" data-category="physics"
                    data-lang-key="cat_physics">Physics</button>
                <button type="button" class="pill-btn" data-category="books" data-lang-key="cat_books">Books</button>
            </nav>
        </section>

        <!-- GRID DAFTAR KARTU ARTIKEL / PORTOFOLIO -->
        <section class="cards-section">
            <div class="cards-grid" id="cardsGrid">
                <!-- Kartu-kartu akan dirender secara dinamis oleh category.js -->
            </div>

            <!-- State Kosong jika Tidak Ada Artikel yang Cocok -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
                <h3 data-lang-key="empty_title">Tidak ada konten ditemukan</h3>
                <p data-lang-key="empty_desc">Coba pilih kategori lain atau gunakan kata kunci pencarian yang berbeda.
                </p>
                <button type="button" class="btn-reset-filter" id="btnResetFilter" data-lang-key="btn_reset">Tampilkan
                    Semua</button>
            </div>
        </section>

    </main>

</body>

</html>
